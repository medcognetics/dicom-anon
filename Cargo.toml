[workspace]
members = ["core", "report", "parquet", "bindings/python", "bindings/node"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Scott Chase Waggener <chase.waggener@icloud.com>"]
repository = "https://github.com/TidalPaladin/dicom-anon"

[workspace.dependencies]
blake3 = "=1.8.2"
arrow = "=57.2.0"
chrono = { version = "=0.4.42", default-features = false, features = ["std"] }
clap = { version = "=4.5.54", features = ["derive", "env"] }
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support", "plotters"] }
dicom-core = "=0.10.0"
dicom-dictionary-std = "=0.10.0"
dicom-json = "=0.10.0"
dicom-object = { version = "=0.10.0", features = ["inventory-registry"] }
dicom-parser = "=0.10.0"
dicom-transfer-syntax-registry = { version = "=0.10.0", features = ["inventory-registry"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
flate2 = "=1.1.8"
indicatif = "=0.18.4"
jpeg-decoder = { version = "=0.3.2", default-features = false }
jpeg-encoder = { version = "=0.7.0", default-features = false, features = ["std"] }
leptess = "=0.14.0"
napi = { version = "=3.10.3", default-features = false, features = ["napi8"] }
napi-derive = "=3.5.9"
napi-build = "=2.3.2"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["api-24", "cuda", "load-dynamic"] }
pure_jpeg2k = { version = "=2.0.0", default-features = false }
pure_jpegli = { version = "=2.0.0", default-features = false }
pure_jpegls = { version = "=2.0.0", default-features = false }
pdfium-render = { version = "=0.9.3", default-features = false, features = ["image_025", "pdfium_7881", "thread_safe"] }
parquet = { version = "=57.2.0", default-features = false, features = ["arrow", "zstd"] }
pyo3 = { version = "=0.29.0", features = ["abi3-py310", "extension-module"] }
rayon = "=1.11.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tar = "=0.4.45"
tempfile = "=3.24.0"
thiserror = "=2.0.17"
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"] }
ureq = { version = "=3.1.4", default-features = false, features = ["rustls"] }
xxhash-rust = { version = "=0.8.15", features = ["xxh3"] }
zeroize = "=1.8.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
