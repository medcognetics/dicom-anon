[project]
name = "dicom-anon-ci"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    "basedpyright==1.39.9",
    "maturin==1.14.1",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "ruff==0.15.22",
    "zizmor==1.27.0",
]

[tool.uv]
package = false

[tool.basedpyright]
include = [".", "../../tests/test_ci.py", "../../tests/test_ci_reporting.py"]
exclude = [".venv"]
extraPaths = ["../.."]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportAny = false
reportExplicitAny = false
reportUnusedCallResult = false
