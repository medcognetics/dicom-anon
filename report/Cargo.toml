[package]
name = "dicom-anon-report"
description = "Local text and PDF privacy filtering with DICOM-aware linkage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[lib]
name = "dicom_anon_report"

[features]
default = ["pdf"]
pdf = ["dep:image", "dep:leptess", "dep:pdfium-render"]

[dependencies]
clap.workspace = true
dicom-anon = { path = "../core" }
dicom-core.workspace = true
dicom-dictionary-std.workspace = true
flate2.workspace = true
image = { workspace = true, optional = true }
indicatif.workspace = true
leptess = { workspace = true, optional = true }
ort.workspace = true
pdfium-render = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokenizers.workspace = true
ureq.workspace = true
zeroize.workspace = true

[dev-dependencies]
dicom-object.workspace = true

[[bin]]
name = "report-anon"
path = "src/bin/report-anon.rs"
