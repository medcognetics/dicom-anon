name: Linux CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  supported-versions:
    name: Linux / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Latest
            rust: "1.97.1"
            python: "3.14"
            node: "24.18.0"
            rust_components: rustfmt, clippy, llvm-tools-preview
            make_target: ci
            cache_tier: latest
          - name: Minimum
            rust: "1.88.0"
            python: "3.10"
            node: "22.23.1"
            rust_components: rustfmt, clippy
            make_target: ci-minimum
            cache_tier: minimum
    steps:
      - name: Install container prerequisites
        run: |
          if ! command -v cc >/dev/null ||
            ! command -v clang >/dev/null ||
            ! command -v curl >/dev/null ||
            ! command -v git >/dev/null ||
            ! command -v pkg-config >/dev/null ||
            ! pkg-config --exists lept tesseract; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
              build-essential \
              ca-certificates \
              clang \
              curl \
              git \
              libclang-dev \
              libleptonica-dev \
              libtesseract-dev \
              pkg-config \
              tesseract-ocr \
              tesseract-ocr-eng
          fi
          pkg-config --exists lept tesseract
          tesseract --list-langs | grep --fixed-strings --line-regexp eng
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ matrix.rust }}
          components: ${{ matrix.rust_components }}
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: linux-x64-${{ matrix.cache_tier }}-rust-${{ matrix.rust }}-debug
          cache-on-failure: false
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: tools/ci/uv.lock
          save-cache: ${{ github.event_name != 'pull_request' }}
      - name: Install Node.js without a writable cache
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install Node.js with a trusted cache
        if: github.event_name != 'pull_request'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - name: Install Go for actionlint
        if: matrix.cache_tier == 'latest'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          cache: false
      - name: Install actionlint
        if: matrix.cache_tier == 'latest'
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          GOBIN="${RUNNER_TEMP}/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/bin/actionlint" -version
      - name: Install cargo-llvm-cov
        if: matrix.cache_tier == 'latest'
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-llvm-cov@0.8.7
      - name: Synchronize CI tools
        run: uv sync --project tools/ci --frozen --python "${{ matrix.python }}"
      - name: Run ${{ matrix.name }} checks
        run: make ${{ matrix.make_target }}

  report-cpu:
    name: Linux / Report CPU integration
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    env:
      # The pinned CPU bundle (Q4 model, ONNX Runtime, PDFium). The installer verifies every
      # download, and model loading verifies the model files again. The cached runtime
      # libraries are not re-verified, so only master runs save the cache, and the key
      # changes with any installer pin.
      DICOM_ANON_REPORT_MODEL_DIR: /github/home/report-assets/privacy-filter-7ffa9a043d54d1be65afb281eddf0ffbe629385b-ort-1.27.1-cpu
    steps:
      - name: Install container prerequisites
        run: |
          if ! command -v cc >/dev/null ||
            ! command -v clang >/dev/null ||
            ! command -v curl >/dev/null ||
            ! command -v git >/dev/null ||
            ! command -v pkg-config >/dev/null ||
            ! pkg-config --exists lept tesseract; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
              build-essential \
              ca-certificates \
              clang \
              curl \
              git \
              libclang-dev \
              libleptonica-dev \
              libtesseract-dev \
              pkg-config \
              tesseract-ocr \
              tesseract-ocr-eng
          fi
          pkg-config --exists lept tesseract
          tesseract --list-langs | grep --fixed-strings --line-regexp eng
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.97.1"
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: linux-x64-report-cpu-rust-1.97.1-debug
          cache-on-failure: false
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Restore pinned CPU report assets
        id: report-assets
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DICOM_ANON_REPORT_MODEL_DIR }}
          key: report-cpu-assets-privacy-filter-7ffa9a043d54d1be65afb281eddf0ffbe629385b-ort-1.27.1-pdfium-7881-${{ hashFiles('report/src/install.rs') }}
      - name: Install pinned CPU report assets
        if: steps.report-assets.outputs.cache-hit != 'true'
        run: |
          cargo run --locked -p dicom-anon-report --bin report-anon -- \
            model install --backend cpu \
            --target "${DICOM_ANON_REPORT_MODEL_DIR}" --progress never --quiet
      - name: Locate the bundled runtime libraries
        run: |
          ort="$(find "${DICOM_ANON_REPORT_MODEL_DIR}/runtime/cpu" -name 'libonnxruntime.so.1.27.1' -print -quit)"
          pdfium="$(find "${DICOM_ANON_REPORT_MODEL_DIR}/runtime/pdfium" -name 'libpdfium.so' -print -quit)"
          [[ -f "${ort}" ]] || { echo "ONNX Runtime library not found in the bundle" >&2; exit 1; }
          [[ -f "${pdfium}" ]] || { echo "PDFium library not found in the bundle" >&2; exit 1; }
          echo "DICOM_ANON_REPORT_ORT_LIBRARY=${ort}" >> "${GITHUB_ENV}"
          echo "DICOM_ANON_REPORT_PDFIUM_LIBRARY=${pdfium}" >> "${GITHUB_ENV}"
      - name: Run CPU model, CLI, and PDF integration
        run: make report-integration
      # Save only a bundle that passed the tests, and only from master.
      - name: Save pinned CPU report assets
        if: github.ref == 'refs/heads/master' && steps.report-assets.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DICOM_ANON_REPORT_MODEL_DIR }}
          key: ${{ steps.report-assets.outputs.cache-primary-key }}

  required:
    name: Linux / Required
    if: always()
    needs: [supported-versions, report-cpu]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every Linux check
        env:
          SUPPORTED_VERSIONS_RESULT: ${{ needs.supported-versions.result }}
          REPORT_CPU_RESULT: ${{ needs.report-cpu.result }}
        run: |
          if [[ "${REPORT_CPU_RESULT}" != "success" ]]; then
            echo "The CPU report integration must pass: ${REPORT_CPU_RESULT}."
            exit 1
          fi
          if [[ "${SUPPORTED_VERSIONS_RESULT}" != "success" ]]; then
            echo "Latest and minimum Linux checks must pass."
            exit 1
          fi
