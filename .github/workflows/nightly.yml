name: Nightly

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release:
    name: Nightly / Validate and release
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - name: Install container prerequisites
        run: |
          if ! command -v cc >/dev/null ||
            ! command -v clang >/dev/null ||
            ! command -v curl >/dev/null ||
            ! command -v git >/dev/null ||
            ! command -v pkg-config >/dev/null ||
            ! pkg-config --exists lept tesseract; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
              build-essential \
              ca-certificates \
              clang \
              curl \
              git \
              libclang-dev \
              libleptonica-dev \
              libtesseract-dev \
              pkg-config \
              tesseract-ocr \
              tesseract-ocr-eng
          fi
          pkg-config --exists lept tesseract
          tesseract --list-langs | grep --fixed-strings --line-regexp eng
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy, llvm-tools-preview
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: nightly-linux-x64-rust-1.97.1-release
          cache-on-failure: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: tools/ci/uv.lock
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - name: Install Go for actionlint
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          cache: false
      - name: Install actionlint
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          GOBIN="${RUNNER_TEMP}/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/bin/actionlint" -version
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-llvm-cov@0.8.7
      - name: Synchronize CI tools
        run: uv sync --project tools/ci --frozen --python "3.14"
      - name: Validate repository
        run: make ci
      - name: Build release profile
        run: make release
