name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release / Linux x86_64
    runs-on: [self-hosted, linux, x64, beryl]
    container:
      image: ubuntu:24.04@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    # Only the final step needs write access. The audit step also gets this token for
    # zizmor online checks; it runs only the tools pinned in tools/ci/uv.lock.
    permissions:
      contents: write
      actions: read
      checks: read
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Install container prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            curl \
            gh \
            git \
            libclang-dev \
            libleptonica-dev \
            libtesseract-dev \
            pkg-config \
            tesseract-ocr \
            tesseract-ocr-eng \
            xz-utils
          pkg-config --exists lept tesseract
          gh --version
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the checkout for build-time commit discovery
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      # The release job installs its own pinned tools into a fresh job directory and does
      # not use the runner tool cache, which pull-request jobs on beryl can write.
      - name: Install pinned release tools
        env:
          UV_VERSION: "0.11.29"
          UV_SHA256: 04f8b82f5d47f0512dcd32c67a4a6f16a0ea27c81537c338fd0ad6b23cebe829
          NODE_VERSION: "24.18.0"
          NODE_SHA256: 55aa7153f9d88f28d765fcdad5ae6945b5c0f98a36881703817e4c450fa76742
          RUSTUP_VERSION: "1.29.1"
          RUSTUP_SHA256: dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71
          RUST_TOOLCHAIN: "1.97.1"
          # uv verifies the Python download against the checksum built into uv.
          PYTHON_VERSION: "3.14.6"
        run: |
          tools="${RUNNER_TEMP}/release-tools"
          rm -rf "${tools}"
          mkdir -p "${tools}/bin" "${tools}/downloads" "${tools}/node"
          fetch() {
            curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
              --retry 5 --output "$2" "$1"
          }
          verify() {
            echo "$1  $2" | sha256sum --check --strict
          }
          fetch "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz" \
            "${tools}/downloads/uv.tar.gz"
          verify "${UV_SHA256}" "${tools}/downloads/uv.tar.gz"
          tar -xzf "${tools}/downloads/uv.tar.gz" --strip-components=1 -C "${tools}/bin"
          fetch "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" \
            "${tools}/downloads/node.tar.xz"
          verify "${NODE_SHA256}" "${tools}/downloads/node.tar.xz"
          tar -xJf "${tools}/downloads/node.tar.xz" --strip-components=1 -C "${tools}/node"
          fetch "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-gnu/rustup-init" \
            "${tools}/downloads/rustup-init"
          verify "${RUSTUP_SHA256}" "${tools}/downloads/rustup-init"
          chmod +x "${tools}/downloads/rustup-init"
          export RUSTUP_HOME="${tools}/rustup" CARGO_HOME="${tools}/cargo"
          "${tools}/downloads/rustup-init" -y --no-modify-path --profile minimal \
            --default-toolchain "${RUST_TOOLCHAIN}"
          export UV_CACHE_DIR="${tools}/uv-cache" UV_PYTHON_INSTALL_DIR="${tools}/python"
          "${tools}/bin/uv" python install "${PYTHON_VERSION}"
          {
            echo "RUSTUP_HOME=${RUSTUP_HOME}"
            echo "CARGO_HOME=${CARGO_HOME}"
            echo "UV_CACHE_DIR=${UV_CACHE_DIR}"
            echo "UV_PYTHON_INSTALL_DIR=${UV_PYTHON_INSTALL_DIR}"
            echo "UV_PYTHON_PREFERENCE=only-managed"
            echo "UV_PYTHON=${PYTHON_VERSION}"
            echo "npm_config_cache=${tools}/npm-cache"
          } >> "${GITHUB_ENV}"
          {
            echo "${tools}/bin"
            echo "${tools}/node/bin"
            echo "${CARGO_HOME}/bin"
          } >> "${GITHUB_PATH}"
          "${tools}/bin/uv" --version
          "${tools}/node/bin/node" --version
          "${CARGO_HOME}/bin/rustc" --version
      - name: Install cargo-audit and cargo-cyclonedx
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-audit@0.22.2,cargo-cyclonedx@0.5.9
      - name: Synchronize CI tools
        run: uv sync --project tools/ci --frozen
      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${EVENT_NAME}" == "push" ]]; then
            tag="${REF_NAME}"
          else
            tag="$(uv run --project tools/ci --frozen python tools/ci/release.py manifest-tag)"
          fi
          uv run --project tools/ci --frozen python tools/ci/release.py check-version --tag "${tag}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
      - name: Require release preconditions
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          commit="$(git rev-parse HEAD)"
          test "${commit}" = "${GITHUB_SHA}"
          tag_type="$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq .object.type)"
          if [[ "${tag_type}" != "tag" ]]; then
            echo "::error::${TAG} must be an annotated or signed tag."
            exit 1
          fi
          ancestry="$(gh api "repos/${GH_REPO}/compare/master...${commit}" --jq .status)"
          if [[ "${ancestry}" != "identical" && "${ancestry}" != "behind" ]]; then
            echo "::error::${TAG} must point to a commit on master."
            exit 1
          fi
          required="$(gh api "repos/${GH_REPO}/commits/${commit}/check-runs?check_name=Linux%20%2F%20Required&filter=all" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')"
          if [[ "${required}" -lt 1 ]]; then
            echo "::error::Linux / Required has not passed on ${commit}."
            exit 1
          fi
          nightly="$(gh api "repos/${GH_REPO}/actions/workflows/nightly.yml/runs?head_sha=${commit}&status=success" \
            --jq .total_count)"
          if [[ "${nightly}" -lt 1 ]]; then
            echo "::error::Nightly has not passed on ${commit}. Dispatch it on master before tagging."
            exit 1
          fi
      - name: Run all security scanners
        env:
          GH_TOKEN: ${{ github.token }}
        run: make audit
      - name: Build release assets
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          uv run --project tools/ci --frozen python tools/ci/release.py build --tag "${TAG}"
      - name: Write release notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          uv run --project tools/ci --frozen python tools/ci/release.py notes \
            --tag "${TAG}" --notes "${RUNNER_TEMP}/release-notes.md"
          (cd target/release-assets && sha256sum --check SHA256SUMS)
      - name: Create draft GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            --draft \
            --verify-tag \
            --title "dicom-anon ${TAG#v}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            target/release-assets/*
